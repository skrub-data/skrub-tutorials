[workspace]
authors = ["Riccardo Cappuzzo <riccardo.cappuzzo@gmail.com>"]
channels = ["conda-forge"]
name = "skrub-tutorials"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"

[dependencies]
python = ">=3.11"
pandas = ">=2.3.3,<3"
polars = ">=1.35.1,<2"
scikit-learn = ">=1.7.2,<2"
seaborn = ">=0.13.2,<0.14"
pyarrow = ">=22.0.0,<23"
jupyterlab = "*"
notebook = ">=7.5.0,<8"
jupytext = ">=1.19.1,<2"
plotly = "*"
jupyter = "*"

[pypi-dependencies]
skrub = {git = "git+https://github.com/skrub-data/skrub.git"}

[environments]
lint = ["lint"]
doc = ["doc"]
dev = ["dev", "doc", "lint"]

[feature.dev.dependencies]
ipykernel = "*"
ipython = ">=9.7.0,<10"

[feature.lint.dependencies]
ruff = "*"
black = "*"
jupyter = ">=1.1.1,<2"

[feature.doc.dependencies]
jupyter-book = "*"
jupyterlite = "*"
jupyterlite-pyodide-kernel = "*"
python-libarchive-c = "*"
quarto = "*"
jupytext = ">=1.18.1,<2"
jupyterquiz = ">=2.9.6.2,<3"

[feature.doc.tasks]
render-book = { cmd = "rm -rf _build/book && quarto render book/", env = { "SKB_TABLE_REPORT_VERBOSITY" = "0" } }
render-slides = { cmd = "rm -rf _build/slides && quarto render slides/", env = { "SKB_TABLE_REPORT_VERBOSITY" = "0" } }
# --no-clean: the root output dir also holds the book and slides builds,
# which live outside this project and would be removed by quarto's cleanup.
render-site = { cmd = "quarto render --no-clean", env = { "SKB_TABLE_REPORT_VERBOSITY" = "0" } }
clean = { cmd = "rm -rf _build" }
create-notebooks-dir = { cmd = "mkdir -p ./content/notebooks" }
convert-exercises-to-notebooks = { cmd = "jupytext --to notebook ./content/exercises/*.py && mv ./content/exercises/*.ipynb ./content/notebooks", depends-on = [
    "create-notebooks-dir",
] }
convert-exercises-to-executed-notebooks = { cmd = "jupytext --to notebook --execute ./content/exercises/*.py && mv ./content/exercises/*.ipynb ./content/notebooks", depends-on = [
    "create-notebooks-dir",
] }
copy-data = { cmd = "cp -r ./data ./content/" }
materials = { depends-on = [
    "convert-exercises-to-notebooks",
    "copy-data",
] }
setup-jupyterlite-content = { cmd = "mkdir -p ./content/notebooks ./content/data && cp ../content/notebooks/*.ipynb ./content/notebooks && cp -r ../data/adult_census ../data/employee_salaries ../data/wine ../data/cleaner_data.csv ../data/parallel_coordinates_hgbr.json ./content/data", cwd = "jupyterlite", depends-on = [
    "convert-exercises-to-notebooks",
] }
build-jupyterlite = { cmd = "jupyter lite build --contents ./content --output-dir dist", cwd = "jupyterlite", depends-on = [
    "setup-jupyterlite-content"
] }
copy-jupyterlite = { cmd = "mkdir -p ../_build/jupyterlite && cp -r dist/* ../_build/jupyterlite/", cwd = "jupyterlite", depends-on = [
    "build-jupyterlite",
] }

# Full website build: cleans the output dir, converts the exercises into
# notebooks, builds the JupyterLite site and renders the three Quarto
# projects (root landing page, book, slides) into _build.
# build-jupyterlite already depends on the notebook conversion.
render = { cmd = "rm -rf _build && pixi run -e doc build-jupyterlite && pixi run -e doc render-book && pixi run -e doc render-slides && pixi run -e doc render-site && pixi run -e doc copy-jupyterlite" }
serve = { cmd = "python -m http.server --directory _build 8000", depends-on = [
    "render",
] }
