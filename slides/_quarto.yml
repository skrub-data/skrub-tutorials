project:
  type: website  
  title: "Skrub - Machine learning with dataframes (Slides)"
  output-dir: ../_build/slides
  render:
    - index.qmd
    - chapters/*.qmd

website:
  title: "Skrub Slides"
  navbar:
    left:
      - text: "Home"
        href: ../index.html
      - text: "Book"
        href: ../book/index.html
      - text: "Slides"
        href: index.html

format:
  revealjs:
    theme: default
    output-ext: slides.html
    slide-number: true
    transition: slide
    code-fold: false
    code-tools: true
    scrollable: true
    footer: "[← Back to Slides Index](../../slides/index.html)"
    resources:
      - chapters/images/report/*
      - data/adult_census.html


execute:
  freeze: auto
  echo: true